apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: hemanthreddy1021/devops-fastapi:fd1a2332f5f54e97188997fe4dac118cf36d72a8
          ports:
            - containerPort: 8000
